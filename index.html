<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Architect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Game UI Overlay -->
    <div id="ui-container">
        <select id="level-select">
            <option value="0">Level 1</option>
            <option value="1">Level 2</option>
            <option value="2">Level 3</option>
            <option value="3">Level 4</option>
            <option value="4">Level 5</option>
        </select>
        <button id="btn-drop">Drop</button>
        <button id="btn-reset">Reset</button>
    </div>

    <!-- Win / Loss Modal -->
    <div id="message-modal" class="hidden">
        <div class="modal-content">
            <h1 id="message-title">You Win!</h1>
            <div class="modal-buttons">
                <button id="btn-play-again">Replay Level</button>
                <button id="btn-next-level" class="hidden">Next Level</button>
            </div>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    
    <!-- Game Logic -->
    <script src="main.js"></script>
</body>
</html>
