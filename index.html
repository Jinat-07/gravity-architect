<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gravity Architect</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Game UI Overlay -->
    <div id="ui-container">
        <button id="btn-drop">Drop Ball</button>
        <button id="btn-reset">Reset Level</button>
    </div>

    <!-- Win / Loss Modal (Hidden by default) -->
    <div id="message-modal" class="hidden">
        <div class="modal-content">
            <h1 id="message-title">You Win!</h1>
            <button id="btn-play-again">Play Again</button>
        </div>
    </div>

    <!-- Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/cannon.js/0.6.2/cannon.min.js"></script>
    
    <!-- Game Logic -->
    <script src="main.js"></script>
</body>
</html>
